name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Package release
        run: |
          # build.sh syncs the bundled server files from the repo root first,
          # so the release can never ship a stale copy of server.py.
          sh "Magisk Module/build.sh"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/filebase-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
