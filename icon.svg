<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3bcff"/>
      <stop offset=".42" stop-color="#7a86ff"/>
      <stop offset=".78" stop-color="#5d67e8"/>
      <stop offset="1" stop-color="#4048c4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e7ff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mint" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#c9fff2"/>
      <stop offset="1" stop-color="#2ed3b3"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="3"/>

  <!-- liquid glass panel -->
  <rect x="58" y="58" width="396" height="396" rx="92" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".38" stroke-width="3"/>
  <path d="M112 74h288c21 0 38 17 38 38v52c-56 26-128 40-206 40S94 190 74 164V112c0-21 17-38 38-38z" fill="url(#sheen)" opacity=".8"/>
  <ellipse cx="150" cy="430" rx="170" ry="34" fill="#2a2f8f" opacity=".28" filter="url(#soft)"/>

  <!-- folder glyph -->
  <g>
    <path d="M128 178c0-17 14-31 31-31h63l30 30h101c17 0 31 14 31 31v131c0 17-14 31-31 31H159c-17 0-31-14-31-31z"
          fill="url(#folder)" opacity=".98"/>
    <path d="M128 232h288v107c0 17-14 31-31 31H159c-17 0-31-14-31-31z" fill="#c9d0ff" opacity=".9"/>
    <path d="M128 232h288" stroke="#ffffff" stroke-width="6" opacity=".9"/>
    <path d="M128 178c0-17 14-31 31-31h63l30 30h101c17 0 31 14 31 31v14H128z" fill="#ffffff" opacity=".55"/>
  </g>

  <!-- mint status pip + specular sparkles -->
  <circle cx="378" cy="150" r="26" fill="url(#mint)"/>
  <circle cx="378" cy="150" r="26" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3"/>
  <circle cx="370" cy="142" r="7" fill="#ffffff" opacity=".85"/>
  <circle cx="116" cy="118" r="10" fill="#ffffff" opacity=".6"/>
  <circle cx="92" cy="352" r="6" fill="#ffffff" opacity=".4"/>
</svg>
